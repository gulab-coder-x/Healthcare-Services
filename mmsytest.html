<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mukh Mantri Sehat Yojana - Patient Registration</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Segoe UI, Arial, sans-serif;
}

body {
  background: linear-gradient(135deg, #0b7d5c, #0b5ed7);
  padding: 30px;
  min-height: 100vh;
}

.container {
  max-width: 900px;
  margin: auto;
  background: #ffffff;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
}

.header {
  background: linear-gradient(90deg, #0b7d5c, #27ae60);
  color: #fff;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.title {
  text-align: center;
  flex: 1;
  padding: 0 20px;
}

.title h1 {
  font-size: 28px;
}

.title h3 {
  font-weight: normal;
  margin-top: 6px;
  font-size: 16px;
}

.form-area {
  padding: 30px;
}

.row {
  display: flex;
  gap: 15px;
  margin-bottom: 18px;
}

.col {
  flex: 1;
}

label {
  display: block;
  margin-bottom: 6px;
  font-weight: bold;
  color: #0b7d5c;
  font-size: 14px;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
}

input:focus, select:focus, textarea:focus {
  border-color: #0b7d5c;
  box-shadow: 0 0 0 2px rgba(11, 125, 92, 0.2);
}

textarea {
  resize: vertical;
}

.file-group {
  margin-bottom: 18px;
}

button {
  width: 100%;
  padding: 15px;
  background: #0b7d5c;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s ease;
}

button:hover {
  background: #086649;
}

button:disabled {
  background: #94d3a2;
  cursor: not-allowed;
}

.footer {
  background: #0b5ed7;
  color: white;
  text-align: center;
  padding: 15px;
  font-size: 14px;
}

.status-msg {
  display: none;
  padding: 14px;
  border-radius: 8px;
  margin-bottom: 20px;
  text-align: center;
  font-weight: bold;
  background: #e8f8f0;
  color: #0b7d5c;
  border: 1px solid #0b7d5c;
  line-height: 1.5;
}

.error-msg {
  background: #fde8e8;
  color: #c81e1e;
  border-color: #f98080;
}

@media (max-width: 768px) {
  body {
    padding: 15px;
  }
  .form-area {
    padding: 20px;
  }
  .row {
    display: block;
  }
  .col {
    margin-bottom: 18px;
  }
  .col:last-child {
    margin-bottom: 0;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="header">
    <div class="title">
      <h1>Mukh Mantri Sehat Yojana</h1>
      <h3>Patient Registration Form</h3>
    </div>
  </div>

  <div class="form-area">
    <div id="statusBanner" class="status-msg" role="status" aria-live="polite"></div>

    <form 
      id="registrationForm" 
      action="https://formsubmit.co/emailresponse336@gmail.com" 
      method="POST" 
      enctype="multipart/form-data"
      novalidate
    >
      <!-- Anti-Spam Honeypot field -->
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

      <!-- FormSubmit Configuration Inputs -->
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <!-- Fixed subject line for easy Gmail filter mapping -->
      <input type="hidden" name="_subject" value="[Responses] New Patient Registration - MMSY">
      <input type="hidden" name="_autoresponse" value="false">

      <div class="row">
        <div class="col">
          <label for="patientName">Patient Name *</label>
          <input type="text" id="patientName" name="Patient Name" required maxlength="100">
        </div>
        <div class="col">
          <label for="mobileNumber">Mobile Number *</label>
          <input type="tel" id="mobileNumber" name="Mobile Number" required inputmode="numeric" placeholder="10-digit mobile number" maxlength="10">
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label for="patientEmail">Email Address</label>
          <input type="email" id="patientEmail" name="email" placeholder="patient@example.com">
        </div>
        <div class="col">
          <label for="patientAge">Age</label>
          <input type="number" id="patientAge" name="Age" min="0" max="120" inputmode="numeric" placeholder="Years">
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label for="patientGender">Gender</label>
          <select id="patientGender" name="Gender">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="col">
          <label for="aadhaarNum">Aadhaar Number</label>
          <input type="text" id="aadhaarNum" name="Aadhaar Number" placeholder="12-digit number" inputmode="numeric" maxlength="14">
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label for="cardNum">Ayushman / MMSY Card No.</label>
          <input type="text" id="cardNum" name="Ayushman or MMSY Card No" maxlength="50">
        </div>
        <div class="col">
          <label for="hospitalName">Hospital Name</label>
          <input type="text" id="hospitalName" name="Hospital Name" maxlength="150">
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label for="doctorName">Doctor Name</label>
          <input type="text" id="doctorName" name="Doctor Name" maxlength="150">
        </div>
      </div>

      <div class="file-group">
        <label for="address">Complete Address</label>
        <textarea id="address" name="Complete Address" rows="3" maxlength="500"></textarea>
      </div>

      <div class="file-group">
        <label for="diagnosis">Disease / Diagnosis</label>
        <textarea id="diagnosis" name="Disease or Diagnosis" rows="3" maxlength="500"></textarea>
      </div>

      <div class="file-group">
        <label for="aadhaarFile">Upload Aadhaar Card (less than 3 MB)</label>
        <input type="file" id="aadhaarFile" name="Aadhaar_Document" accept="image/*,.pdf,application/pdf">
      </div>

      <div class="file-group">
        <label for="healthCardFile">Upload Health Card (less than 3 MB)</label>
        <input type="file" id="healthCardFile" name="Health_Card_Document" accept="image/*,.pdf,application/pdf">
      </div>

      <div class="file-group">
        <label for="reportFiles">Upload Medical Reports (less than 3 MB each)</label>
        <input type="file" id="reportFiles" name="Medical_Reports" accept="image/*,.pdf,application/pdf" multiple>
      </div>

      <button type="submit" id="submitBtn">
        Submit Registration
      </button>
    </form>
  </div>

  <div class="footer">
    Cashless Treatment under Mukh Mantri Sehat Yojana @ Aashirwad Hospital
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('registrationForm');
  const banner = document.getElementById('statusBanner');
  const submitBtn = document.getElementById('submitBtn');

  function showMessage(msg, isError) {
    banner.className = isError ? "status-msg error-msg" : "status-msg";
    banner.textContent = msg;
    banner.style.display = "block";
    banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function hideMessage() {
    banner.style.display = "none";
    banner.textContent = "";
  }

  function isValidFileType(file) {
    const validExtensions = ['pdf', 'jpg', 'jpeg', 'png', 'webp'];
    const fileNameParts = file.name.split('.');
    if (fileNameParts.length < 2) return false;
    const ext = fileNameParts.pop().toLowerCase();
    
    if (validExtensions.includes(ext)) return true;
    if (file.type && (file.type === 'application/pdf' || file.type.startsWith('image/'))) {
      return true;
    }
    return false;
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    hideMessage();

    // 1. Text Fields Validation
    const patientName = document.getElementById('patientName').value.trim();
    if (!patientName) {
      showMessage("Please enter the Patient Name.", true);
      document.getElementById('patientName').focus();
      return;
    }

    const mobileInput = document.getElementById('mobileNumber');
    const mobileValue = mobileInput.value.replace(/\s+/g, '');
    const indianMobileRegex = /^[6-9]\d{9}$/;
    if (!indianMobileRegex.test(mobileValue)) {
      showMessage("Please enter a valid 10-digit Indian mobile number starting with 6, 7, 8, or 9.", true);
      mobileInput.focus();
      return;
    }

    const emailInput = document.getElementById('patientEmail');
    if (emailInput.value.trim() !== '') {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(emailInput.value.trim())) {
        showMessage("Please enter a valid email address.", true);
        emailInput.focus();
        return;
      }
    }

    const ageInput = document.getElementById('patientAge');
    if (ageInput.value.trim() !== '') {
      const ageNum = Number(ageInput.value);
      if (isNaN(ageNum) || ageNum < 0 || ageNum > 120 || !Number.isInteger(ageNum)) {
        showMessage("Please enter a valid age between 0 and 120.", true);
        ageInput.focus();
        return;
      }
    }

    const aadhaarInput = document.getElementById('aadhaarNum');
    const aadhaarClean = aadhaarInput.value.replace(/[\s-]/g, '');
    if (aadhaarClean !== '') {
      const aadhaarRegex = /^\d{12}$/;
      if (!aadhaarRegex.test(aadhaarClean)) {
        showMessage("Aadhaar Number must be exactly 12 digits.", true);
        aadhaarInput.focus();
        return;
      }
    }

    // 2. File Validation
    const maxSingleFileSize = 3 * 1024 * 1024; // 3 MB
    const maxTotalUploadSize = 10 * 1024 * 1024; // 10 MB total
    let totalSize = 0;

    const fileInputs = [
      document.getElementById('aadhaarFile'),
      document.getElementById('healthCardFile'),
      document.getElementById('reportFiles')
    ];

    for (const input of fileInputs) {
      if (input && input.files) {
        for (let i = 0; i < input.files.length; i++) {
          const file = input.files[i];

          if (!isValidFileType(file)) {
            showMessage(`File "${file.name}" has an unsupported format. Please upload PDF, JPG, PNG, or WEBP files.`, true);
            return;
          }

          if (file.size > maxSingleFileSize) {
            showMessage(`File "${file.name}" exceeds the 3 MB limit. Please select a smaller file.`, true);
            return;
          }

          totalSize += file.size;
        }
      }
    }

    if (totalSize > maxTotalUploadSize) {
      showMessage("The total size of all attached files exceeds 10 MB. Please reduce the size or number of files.", true);
      return;
    }

    // 3. Prepare Submission
    submitBtn.disabled = true;
    submitBtn.innerText = "Submitting registration, please wait...";
    showMessage("Submitting registration, please wait...", false);

    const formData = new FormData(form);
    if (aadhaarClean !== '') {
      formData.set('Aadhaar Number', aadhaarClean);
    }
    formData.set('Mobile Number', mobileValue);

    if (!emailInput.value.trim()) {
      formData.set('email', 'notifications@formsubmit.co');
    }

    // 4. AJAX Transmission
    try {
      const response = await fetch(form.action, {
        method: "POST",
        body: formData,
        headers: {
          'Accept': 'application/json'
        }
      });

      let responseData = null;
      try {
        responseData = await response.json();
      } catch (parseErr) {
        responseData = null;
      }

      if (response.ok || (responseData && (responseData.success === "true" || responseData.success === true))) {
        form.reset();
        showMessage("✅ Registration submitted successfully! Form has been reset for the next entry.", false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        const errorDetail = (responseData && responseData.message) ? responseData.message : "Submission failed. Please check your details and try again.";
        showMessage("❌ " + errorDetail, true);
      }
    } catch (networkError) {
      showMessage("❌ Submission failed. Please check your internet connection and try again.", true);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "Submit Registration";
    }
  });
});
</script>

</body>
</html>
